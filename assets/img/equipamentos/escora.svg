<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustração de escora metálica regulável">
  <defs>
    <pattern id="tex" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#D9D6D0"/>
      <circle cx="6" cy="6" r="1.2" fill="#c9c5bd" opacity="0.7"/>
      <circle cx="18" cy="16" r="1" fill="#c9c5bd" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#tex)"/>
  <polygon points="0,440 640,400 640,480 0,480" fill="#333333" opacity="0.12"/>
  <!-- laje acima -->
  <rect x="120" y="56" width="400" height="34" fill="#333333" opacity="0.85"/>
  <!-- escora -->
  <g stroke="#333333" stroke-width="9" stroke-linejoin="round">
    <!-- tubo externo -->
    <rect x="286" y="238" width="68" height="192" rx="6" fill="#FF7900"/>
    <!-- tubo interno -->
    <rect x="298" y="90" width="44" height="160" rx="4" fill="#FFFFFF"/>
    <!-- furos de ajuste -->
    <g fill="#333333" stroke="none">
      <circle cx="320" cy="120" r="7"/>
      <circle cx="320" cy="152" r="7"/>
      <circle cx="320" cy="184" r="7"/>
      <circle cx="320" cy="216" r="7"/>
    </g>
    <!-- pino -->
    <g stroke="#333333" stroke-width="8" stroke-linecap="round">
      <path d="M280 216 H360"/>
      <circle cx="368" cy="216" r="10" fill="#FF7900"/>
    </g>
    <!-- chapéu superior -->
    <rect x="258" y="72" width="124" height="24" rx="4" fill="#333333"/>
    <!-- base -->
    <rect x="250" y="424" width="140" height="24" rx="4" fill="#333333"/>
    <!-- porca helicoidal -->
    <path d="M298 380 h44 M298 398 h44" stroke-width="6"/>
  </g>
</svg>
