<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustração de compactador de solo com dois tambores">
  <defs>
    <pattern id="tex" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#D9D6D0"/>
      <circle cx="6" cy="6" r="1.2" fill="#c9c5bd" opacity="0.7"/>
      <circle cx="18" cy="16" r="1" fill="#c9c5bd" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#tex)"/>
  <polygon points="0,420 640,385 640,480 0,480" fill="#333333" opacity="0.14"/>
  <!-- solo compactado -->
  <g stroke="#333333" stroke-width="6" opacity="0.5">
    <path d="M120 424 h60 M220 432 h60 M330 424 h60 M430 432 h60"/>
  </g>
  <!-- chassi -->
  <g stroke="#333333" stroke-width="9" stroke-linejoin="round">
    <rect x="198" y="296" width="248" height="42" rx="8" fill="#FF7900"/>
  </g>
  <!-- motor -->
  <g stroke="#333333" stroke-width="9" stroke-linejoin="round">
    <rect x="256" y="232" width="98" height="64" rx="10" fill="#FFFFFF"/>
    <path d="M272 252 h64 M272 268 h64" stroke-width="6"/>
    <path d="M350 242 h22 v-20" fill="none" stroke-width="7"/>
  </g>
  <!-- guidão -->
  <path d="M322 296 L202 154" fill="none" stroke="#FF7900" stroke-width="14" stroke-linecap="round"/>
  <path d="M202 154 h-54" fill="none" stroke="#333333" stroke-width="12" stroke-linecap="round"/>
  <!-- tambores -->
  <g stroke="#333333" stroke-width="9">
    <rect x="160" y="330" width="142" height="76" rx="38" fill="#D9D6D0"/>
    <rect x="342" y="330" width="142" height="76" rx="38" fill="#D9D6D0"/>
  </g>
  <g fill="#FF7900" stroke="#333333" stroke-width="6">
    <circle cx="231" cy="368" r="15"/>
    <circle cx="413" cy="368" r="15"/>
  </g>
</svg>
