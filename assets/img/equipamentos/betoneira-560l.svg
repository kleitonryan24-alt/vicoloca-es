<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustração de betoneira de grande capacidade 560 litros">
  <defs>
    <pattern id="tex" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#D9D6D0"/>
      <circle cx="6" cy="6" r="1.2" fill="#c9c5bd" opacity="0.7"/>
      <circle cx="18" cy="16" r="1" fill="#c9c5bd" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#tex)"/>
  <polygon points="0,440 640,395 640,480 0,480" fill="#333333" opacity="0.12"/>
  <!-- quadro reforçado -->
  <g stroke="#333333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M252 388 L214 436 M332 388 L378 436"/>
    <path d="M238 360 H348"/>
    <path d="M432 302 L518 254" stroke="#FF7900" stroke-width="15"/>
    <path d="M504 244 L532 262" stroke-width="13"/>
  </g>
  <!-- motor grande com polia -->
  <g stroke="#333333" stroke-width="10" stroke-linejoin="round">
    <rect x="352" y="308" width="114" height="74" rx="10" fill="#FFFFFF"/>
    <circle cx="396" cy="344" r="27" fill="#FF7900"/>
    <circle cx="396" cy="344" r="9" fill="#333333" stroke="none"/>
  </g>
  <!-- tambor grande -->
  <g stroke="#333333" stroke-width="11" stroke-linejoin="round">
    <path d="M112 196 L366 244 L348 354 L94 294 Z" fill="#FF7900"/>
    <ellipse cx="112" cy="246" rx="52" ry="80" fill="#FFFFFF"/>
    <ellipse cx="112" cy="246" rx="30" ry="48" fill="#D9D6D0" stroke-width="7"/>
    <path d="M366 244 L348 354" fill="none"/>
  </g>
  <rect x="152" y="226" width="38" height="106" transform="rotate(10 171 279)" fill="#FFFFFF" opacity="0.85"/>
  <!-- rodas pesadas -->
  <g fill="#333333">
    <circle cx="250" cy="432" r="36"/>
    <circle cx="374" cy="432" r="36"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="250" cy="432" r="13"/>
    <circle cx="374" cy="432" r="13"/>
  </g>
</svg>
