<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustração de martelete de construção">
  <defs>
    <pattern id="tex" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#D9D6D0"/>
      <circle cx="6" cy="6" r="1.2" fill="#c9c5bd" opacity="0.7"/>
      <circle cx="18" cy="16" r="1" fill="#c9c5bd" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#tex)"/>
  <polygon points="0,430 640,390 640,480 0,480" fill="#333333" opacity="0.12"/>
  <g stroke="#333333" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- corpo principal -->
    <rect x="196" y="176" width="240" height="104" rx="18" fill="#FF7900"/>
    <!-- motor -->
    <rect x="356" y="188" width="88" height="80" rx="12" fill="#FFFFFF"/>
    <path d="M372 206 h56 M372 224 h56 M372 242 h56" stroke-width="6"/>
    <!-- punho -->
    <path d="M196 214 L128 176" fill="none" stroke-width="16" stroke="#333333"/>
    <path d="M112 168 a20 20 0 1 0 0 40" fill="none" stroke-width="13"/>
    <!-- gatilho -->
    <path d="M180 226 v26" stroke-width="8"/>
    <!-- mandril e broca -->
    <rect x="150" y="200" width="48" height="56" rx="8" fill="#333333"/>
    <path d="M150 228 H70" stroke-width="12"/>
    <path d="M70 218 l-44 10 44 10 z" fill="#FF7900" stroke-width="7"/>
    <!-- trava lateral -->
    <rect x="268" y="152" width="60" height="26" rx="8" fill="#333333"/>
  </g>
  <!-- vibração -->
  <g stroke="#FF7900" stroke-width="6" fill="none" opacity="0.9">
    <path d="M96 168 q-18 14 0 28"/>
    <path d="M74 158 q-28 24 0 48"/>
  </g>
</svg>
