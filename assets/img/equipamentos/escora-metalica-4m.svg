<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustração de escora metálica regulável de 4 metros">
  <defs>
    <pattern id="tex" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#D9D6D0"/>
      <circle cx="6" cy="6" r="1.2" fill="#c9c5bd" opacity="0.7"/>
      <circle cx="18" cy="16" r="1" fill="#c9c5bd" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#tex)"/>
  <polygon points="0,440 640,400 640,480 0,480" fill="#333333" opacity="0.12"/>
  <!-- laje alta -->
  <rect x="120" y="48" width="400" height="32" fill="#333333" opacity="0.85"/>
  <g stroke="#333333" stroke-width="9" stroke-linejoin="round">
    <!-- chapéu superior -->
    <rect x="258" y="80" width="124" height="24" rx="4" fill="#333333"/>
    <!-- tubo interno longo -->
    <rect x="299" y="104" width="42" height="120" rx="4" fill="#FFFFFF"/>
    <g fill="#333333" stroke="none">
      <circle cx="320" cy="124" r="7"/>
      <circle cx="320" cy="152" r="7"/>
      <circle cx="320" cy="180" r="7"/>
      <circle cx="320" cy="208" r="7"/>
    </g>
    <!-- pino -->
    <g stroke="#333333" stroke-width="8" stroke-linecap="round">
      <path d="M282 212 H358"/>
      <circle cx="366" cy="212" r="10" fill="#FF7900"/>
    </g>
    <!-- tubo externo alto -->
    <rect x="286" y="228" width="68" height="196" rx="6" fill="#FF7900"/>
    <path d="M298 386 h44 M298 402 h44 M298 418 h44" stroke-width="6"/>
    <!-- base -->
    <rect x="250" y="424" width="140" height="24" rx="4" fill="#333333"/>
  </g>
</svg>
