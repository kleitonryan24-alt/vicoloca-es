<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustração de furadeira de impacto">
  <defs>
    <pattern id="tex" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#D9D6D0"/>
      <circle cx="6" cy="6" r="1.2" fill="#c9c5bd" opacity="0.7"/>
      <circle cx="18" cy="16" r="1" fill="#c9c5bd" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#tex)"/>
  <polygon points="0,430 640,390 640,480 0,480" fill="#333333" opacity="0.12"/>
  <g stroke="#333333" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- corpo principal -->
    <rect x="238" y="188" width="186" height="88" rx="16" fill="#FF7900"/>
    <!-- traseira / motor -->
    <rect x="362" y="197" width="78" height="70" rx="12" fill="#FFFFFF"/>
    <path d="M378 216 h46 M378 232 h46" stroke-width="6"/>
    <!-- detalhe superior -->
    <rect x="262" y="200" width="46" height="28" rx="6" fill="#333333"/>
    <!-- mandril -->
    <rect x="192" y="205" width="52" height="56" rx="8" fill="#333333"/>
    <rect x="182" y="216" width="12" height="34" rx="4" fill="#333333" stroke="none"/>
    <!-- broca -->
    <path d="M192 233 H104" stroke-width="10"/>
    <path d="M104 223 l-24 10 24 10 z" fill="#FF7900" stroke-width="6"/>
    <path d="M152 227 l10 12 M132 227 l10 12" stroke="#D9D6D0" stroke-width="4"/>
    <!-- punho pistola -->
    <polygon points="380,272 432,272 454,366 402,366" fill="#333333" stroke="#333333" stroke-width="9" stroke-linejoin="round"/>
    <rect x="370" y="280" width="15" height="30" rx="5" fill="#FF7900" stroke="none"/>
    <!-- alça auxiliar -->
    <path d="M218 258 L198 320" stroke-width="11" fill="none"/>
    <circle cx="195" cy="328" r="11" fill="#FF7900"/>
  </g>
</svg>
